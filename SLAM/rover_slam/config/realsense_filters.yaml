# RealSense D435 / D435i Depth & IMU Post-Processing Filter Parameters
# Optimized for NVIDIA Jetson Orin Nano & RTAB-Map Visual SLAM Pipeline

/**:
  ros__parameters:
    # Sensor Streams Configuration
    enable_depth: true
    enable_color: true
    enable_sync: true
    align_depth.enable: true

    # Intel RealSense D435i Internal IMU (BMI055 Accel + Gyro 6-DOF)
    enable_accel: true
    enable_gyro: true
    unite_imu_method: 2  # 2 = linear interpolation into fused /camera/imu topic

    # Resolution & Frame Rate (424x240 @ 30 FPS minimizes USB bandwidth & compute load on Jetson Orin Nano)
    depth_module:
      profile: "424x240x30"
    rgb_camera:
      profile: "424x240x30"

    # Post-Processing Depth Filters Pipeline
    # 1. decimation: downsamples depth grid for high throughput
    # 2. spatial: 2D edge-preserving smoothing filter
    # 3. temporal: frame-to-frame persistence filter
    # 4. hole_filling: interpolates missing depth pixels
    filters: "decimation,spatial,temporal,hole_filling"

    # Max depth clipping range (4.0m) to reject noisy distant terrain
    clip_distance: 4.0


